name: Release

# Solo dai tag. Una Release nasce da una decisione presa scrivendo `git tag`,
# non da ogni push su `main`: il numero di versione è la decisione, e va presa
# una volta sola in un posto solo.
on:
  push:
    tags:
      - 'v*'

# Il token predefinito di GitHub Actions è in sola lettura. Creare una Release e
# allegarci un file richiede di chiederlo qui, esplicitamente.
permissions:
  contents: write

jobs:
  apk-firmato:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Fissata: vedi il commento nel lavoro di analisi di `ci.yml`.
          flutter-version: 3.47.1
          cache: true

      - run: flutter pub get

      # Il segreto contiene il keystore in base64, perché un segreto di GitHub
      # è una stringa e un keystore è un file binario.
      - name: Ricostruisci la chiave dal segreto
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Manca il segreto KEYSTORE_BASE64. Senza, la compilazione ripiegherebbe sulla chiave di debug e produrrebbe una Release che non è un rilascio."
            exit 1
          fi
          # `tr` prima di `base64`: il segreto lo ha scritto una persona, e a
          # seconda di come ci e' arrivato puo' portarsi dietro un a capo, un
          # ritorno a capo di Windows o uno spazio in coda. `base64 -d` tollera
          # gli a capo e non tollera il resto, e il modo in cui fallirebbe -
          # "invalid input" su un segreto che sembra giusto - non direbbe a
          # nessuno che il problema e' un carattere invisibile.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/portfolio.jks"

          # Un keystore PKCS12 comincia con 0x30 0x82. Se il segreto fosse
          # troncato - il rischio vero di seimila caratteri incollati a mano -
          # qui ci sarebbe un file di byte a caso, e l'errore arriverebbe molto
          # piu' avanti da Gradle, parlando d'altro.
          if ! head -c 2 "$RUNNER_TEMP/portfolio.jks" | od -An -tx1 | grep -q "30 82"; then
            echo "::error::Il segreto KEYSTORE_BASE64 non si decodifica in un keystore: probabile che sia stato troncato quando e' stato incollato."
            exit 1
          fi

      # La configurazione di Firebase. Non e' una password, ma non e' nel
      # repository: chi la ha puo' mandare al progetto crash e metriche finti.
      # Qui il ripiego che vale per chi clona - compilare senza, con
      # l'osservabilita' spenta - non e' accettabile: un rilascio senza crash
      # registrati e senza interruttore remoto e' esattamente il rilascio in
      # cui un bug grave non si vede e non si ferma.
      - name: Configurazione di Firebase dal segreto
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Manca il segreto GOOGLE_SERVICES_JSON. Senza, l'APK partirebbe senza crash registrati, senza metriche e senza interruttore remoto."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          # Come per il keystore: un segreto incollato a meta' deve fermarsi
          # qui, con un messaggio che dice perche', e non dentro il plugin dei
          # servizi Google con uno che parla d'altro.
          python3 -m json.tool android/app/google-services.json > /dev/null || { echo "::error::Il segreto GOOGLE_SERVICES_JSON non e' JSON valido: probabile che sia stato troncato quando e' stato incollato."; exit 1; }

      # `v1.2.0` diventa `1.2.0`. Il nome della versione viene da qui e da
      # nessun altro posto; il numero progressivo è quello dell'esecuzione,
      # che cresce da solo e non si ripete mai.
      - name: La versione viene dal tag
        run: echo "VERSIONE=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: APK di rilascio
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/portfolio.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name="$VERSIONE" \
            --build-number="${{ github.run_number }}"
          mv build/app/outputs/flutter-apk/app-release.apk "pos_sync-$VERSIONE.apk"

      # Il passo che rende il ripiego sicuro. Senza chiave, Gradle non fallisce:
      # firma con quella di debug e dice BUILD SUCCESSFUL. Un APK così si
      # installa, sembra un rilascio e non lo è — e sarebbe esattamente il
      # genere di cosa che nessuno nota finché non conta. Qui si legge il
      # certificato vero dell'APK, non la configurazione che avrebbe dovuto
      # produrlo.
      - name: Firmato con la chiave giusta, non con quella di debug
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERTIFICATO=$("$APKSIGNER" verify --print-certs "pos_sync-$VERSIONE.apk")
          echo "$CERTIFICATO"
          if echo "$CERTIFICATO" | grep -q "CN=Android Debug"; then
            echo "::error::L'APK è firmato con la chiave di debug: i segreti non sono arrivati fino a Gradle."
            exit 1
          fi

      # Stesso principio della firma: si guarda l'APK, non il file che avrebbe
      # dovuto finirci. Senza `google-services.json` Gradle non applica i
      # plugin di Firebase e compila lo stesso, di proposito; questa risorsa
      # la scrive solo il plugin dei servizi Google, quindi se manca
      # l'osservabilita' e' spenta.
      - name: Firebase dentro l'APK, non solo nella configurazione
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump resources "pos_sync-$VERSIONE.apk" | grep -q "string/google_app_id" || { echo "::error::Nell'APK non c'e' la configurazione di Firebase: il plugin dei servizi Google non e' stato applicato."; exit 1; }
          echo "Configurazione di Firebase presente."

      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # «Un APK che una persona qualunque scarica e installa» non è dimostrato
      # dal fatto che il file esista. Questo lo installa su un dispositivo vero
      # e verifica che l'applicazione sia ancora viva qualche secondo dopo
      # l'avvio: è il minimo che distingue un APK da un APK che funziona.
      #
      # L'immagine è senza Play Services, e da quando c'è Firebase non è più
      # una scelta neutra: è il caso di un tablet da cassa economico, e l'app
      # deve partire anche lì.
      - name: Si installa e parte
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          script: |
            # Ogni riga di questo script viene eseguita da sola, con un `sh -c`
            # suo: un `if` su piu' righe verrebbe spezzato, e la prima riga da
            # sola non e' un comando valido. Percio' il controllo sta su una
            # riga, con `||` invece che con un blocco.
            adb install -r "pos_sync-$VERSIONE.apk"
            adb logcat -c
            adb shell monkey -p dev.mircozanzaro.pos_sync -c android.intent.category.LAUNCHER 1
            sleep 10
            adb shell pidof dev.mircozanzaro.pos_sync > /dev/null || { echo "::error::L'applicazione non è viva dieci secondi dopo l'avvio."; adb logcat -d -b crash; exit 1; }
            echo "Viva dopo l'avvio."

      - name: Release con l'APK allegato
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "pos_sync-$VERSIONE.apk"
