name: Rigenera i golden

# Solo a mano. I riferimenti visivi non si aggiornano da soli: se lo facessero,
# una regressione grafica verrebbe promossa a riferimento e il test smetterebbe
# di proteggere qualcosa.
on: workflow_dispatch

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Stessa versione fissata nella pipeline principale: i riferimenti
      # generati qui devono essere confrontabili con quelli verificati la'.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - run: flutter pub get

      - run: flutter precache --universal

      - name: Rigenera
        run: flutter test --update-goldens test/order_tile_golden_test.dart

      # Non vengono commessi da qui: un artefatto si scarica, si guarda e si
      # commette a mano. Promuovere immagini in automatico significherebbe
      # accettare qualunque cosa la pipeline abbia disegnato.
      - uses: actions/upload-artifact@v7
        with:
          name: goldens
          path: test/goldens/
