name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # La versione e' fissata, non segue il canale stabile: i golden test
      # confrontano pixel, e il motore di Flutter porta con se' il proprio
      # stack di disegno e di font. Un aggiornamento dell'SDK cambierebbe le
      # immagini di riferimento senza che nessuno abbia toccato il codice, e
      # un test che fallisce da solo e' un test che qualcuno disattiva.
      # Aggiornare la versione qui e' una decisione deliberata, e va fatta
      # insieme alla rigenerazione dei riferimenti.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - run: flutter pub get

      # Gli artefatti dell'SDK si scaricano su richiesta, e `flutter test` da
      # solo non ha motivo di chiedere i font: senza questo passo i golden
      # girerebbero con un carattere segnaposto. L'elenco serve a rendere
      # diagnosticabile un fallimento su una macchina a cui non si ha accesso.
      - name: Font per i golden
        run: |
          flutter precache --universal
          ls -la "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/"

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      # Il codice generato da Drift è versionato, così `flutter test` funziona
      # subito dopo un clone. Questo passo verifica che sia allineato alle
      # tabelle: chi modifica lo schema e dimentica di rigenerare lo scopre
      # qui, non quando una colonna sparisce a runtime.
      - name: Codice generato allineato
        run: |
          dart run build_runner build
          git diff --exit-code

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      # Quando un golden fallisce, Flutter scrive in test/failures l'immagine
      # ottenuta, quella attesa e la differenza fra le due. Senza questo passo
      # il log direbbe solo "0.98%, 253px diff": vero, e inutile per capire
      # cosa e' cambiato.
      - name: Differenze dei golden
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: test/failures/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info

  build-android:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Fissata: vedi il commento nel lavoro di analisi.
          flutter-version: 3.47.1
          cache: true

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

  # Solo la compilazione, non i test: quelli girano gia' su Linux, e ripeterli
  # qui costerebbe minuti per dire la stessa cosa. Cio' che questo lavoro
  # verifica e' l'altra meta': che il codice nativo compili con MSVC e che i
  # pacchetti con una parte C++ - drift attraverso sqlite3, connectivity_plus -
  # abbiano davvero un'implementazione per Windows. E' un fallimento che su
  # Linux non si vedrebbe mai.
  build-windows:
    needs: analyze-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Fissata: vedi il commento nel lavoro di analisi.
          flutter-version: 3.47.1
          cache: true

      - run: flutter pub get

      # In release e non in debug: e' il profilo che passa dall'ottimizzatore
      # e dal collegamento vero, quindi e' quello che puo' rompersi senza che
      # una compilazione di debug se ne accorga.
      - name: Build Windows
        run: flutter build windows --release

      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: build/windows/x64/runner/Release/

  # L'unico lavoro che esegue l'app invece di compilarla soltanto. Copre cio'
  # che gira sotto al livello Dart e che nessun altro test attraversa:
  # path_provider che restituisce una cartella scrivibile, sqlite3 caricato dal
  # sistema, un socket che si lega davvero, il permesso INTERNET del manifest.
  # Sono le cose che falliscono sul dispositivo di qualcun altro.
  integration-android:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Fissata: vedi il commento nel lavoro di analisi.
          flutter-version: 3.47.1
          cache: true

      - run: flutter pub get

      # Senza KVM l'emulatore parte in emulazione software e impiega minuti
      # invece di secondi, quando non scade del tutto. I runner Linux hanno
      # l'hardware ma non i permessi sul nodo: questa regola li concede.
      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test di integrazione su emulatore
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          # L'immagine senza Play Services: piu' leggera da scaricare e
          # sufficiente, perche' l'app non usa nessun servizio Google.
          target: default
          script: flutter test integration_test
