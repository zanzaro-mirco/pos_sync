name: pos_sync
description: App Flutter offline-first per la raccolta ordini - coda outbox, idempotenza, retry con backoff esponenziale.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  get_it: ^7.7.0
  uuid: ^4.4.0
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  connectivity_plus: ^7.3.1
  workmanager: ^0.10.9
  nsd: ^5.0.1

dev_dependencies:
  # Usato solo dal test di migrazione, per scrivere lo schema della versione
  # precedente con SQL grezzo. Arriva comunque con drift come dipendenza
  # transitiva: dichiararlo rende esplicito che questo progetto lo importa.
  sqlite3: ^3.5.2
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  flutter_lints: ^4.0.0
  drift_dev: ^2.34.6
  build_runner: ^2.16.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
