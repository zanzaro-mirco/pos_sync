org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Kotlin lo porta il Kotlin Gradle Plugin, non AGP.
#
# Flutter avvisa a ogni avvio che i plugin che applicano KGP (qui
# workmanager_android) un giorno faranno fallire la build, e invita a passare
# al Built-in Kotlin di AGP 9 mettendo `true` qui. Oggi non si può: il Kotlin
# incluso in AGP 9.4 è il 2.2.10, e Flutter rifiuta di costruire sotto il
# 2.2.20. Provato: la build fallisce sulla validazione di Flutter, non sui
# plugin. Si riprova quando AGP incorpora un Kotlin abbastanza recente.
android.builtInKotlin=false
